const fmt=n=>sp(n)+" ₽";
const num=v=>Number(String(v).replace(/[^\d]/g,""))||0;
const today=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
const ym=d=>(d||"").slice(0,7);
const fdate=d=>d?d.split("-").reverse().join("."):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const typeOf=a=>a?.type||"Агент";
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2200)}
const byDate=(a,b)=>(a.date||"").localeCompare(b.date||"")||(a.created||0)-(b.created||0);

/* Распределение оплат: сначала привязанные к услуге, затем остальные — на самые старые услуги */
function alloc(id){
  const items=S.items.filter(i=>i.agentId===id).sort(byDate).map(i=>({...i,paid:0}));
  const pays=S.payments.filter(p=>p.agentId===id).sort(byDate);
  let free=0;
  for(const p of pays){const it=p.itemId&&items.find(i=>i.id===p.itemId);
    if(it){const take=Math.min(p.amount,it.amount-it.paid);it.paid+=take;if(take>0&&it.paid>=it.amount)it.paidOn=p.date;free+=p.amount-take}
    else{free+=p.amount;for(const x of items){if(free<=0)break;const take=Math.min(free,x.amount-x.paid);if(take<=0)continue;x.paid+=take;free-=take;if(x.paid>=x.amount)x.paidOn=p.date}}}
  const lastD=pays.length?pays[pays.length-1].date:null;
  for(const it of items){const take=Math.min(free,it.amount-it.paid);if(take<=0)continue;it.paid+=take;free-=take;if(it.paid>=it.amount&&!it.paidOn)it.paidOn=lastD}
  return items;
}
const addDays=(d,n)=>{const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dueOf=i=>i.due||addDays(i.date||today(),30);
const dleft=d=>Math.round((Date.parse(d)-Date.parse(today()))/864e5);
function dueInfo(i){const rest=i.amount-(i.paid||0);if(rest<=0)return{k:"ok"};const n=dleft(dueOf(i));return n<0?{k:"over",n:-n,rest}:n<=5?{k:"soon",n,rest}:{k:"wait",n,rest}}
function overdue(id){const it=alloc(id).map(i=>({...i,...dueInfo(i)}));const o=it.filter(i=>i.k==="over"),w=it.filter(i=>i.k==="soon");return{os:o.reduce((a,i)=>a+i.rest,0),on:o.length,maxd:Math.max(0,...o.map(i=>i.n)),wn:w.length,wmin:Math.min(99,...w.map(i=>i.n))}}
const AVC={"Агент":1,"Банк":2,"Клиент":3,"Страховая":4,"Другое":5};
function avatar(a,size){const n=AVC[typeOf(a)]||5;return `<span class="av" style="background:var(--av${n});color:var(--av${n}t)${size?";width:"+size+"px;height:"+size+"px;font-size:"+Math.round(size*.42)+"px":""}">${esc((a.name||"?").trim()[0]?.toUpperCase()||"?")}</span>`}
const uslug=n=>n+" "+(n%10===1&&n%100!==11?"услуга":n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?"услуги":"услуг");
function stats(id){const c=S.items.filter(i=>i.agentId===id).reduce((a,i)=>a+i.amount,0),p=S.payments.filter(i=>i.agentId===id).reduce((a,i)=>a+i.amount,0);return{c,p,d:c-p}}
function agentOpts(sel){return S.agents.map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} · ${typeOf(a)}</option>`).join("")}
function bindMoney(id){const e=$("#"+id);e.addEventListener("input",()=>{const n=num(e.value);e.value=n?sp(n):""})}

function render(){
  document.querySelectorAll("#nav-r button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  const v=$("#view-r");if(window.APP!=="r"){v.innerHTML="";return}
  if(!S.db){v.innerHTML=`<p class="msg">${S.fail?"Не удалось подключиться к хранилищу. Откройте страницу, войдя в свой аккаунт Claude.":"Загружаю записи…"}</p>`;return}
  if(S.edit)return renderEdit(v);
  if(S.report)return renderReport(v);
  if(S.remind)return renderRemind(v);
  if(S.stxt)return renderText(v,S.stxt,"Отчёт текстом",()=>{S.stxt=null;render()});
  if(S.tab==="debts")return S.open?renderAgent(v):renderDebts(v);
  if(S.tab==="add"||S.tab==="pay")return renderForm(v,S.tab==="pay");
  if(S.tab==="stats")return renderStats(v);
  if(S.tab==="agents")return renderAgents(v);
}

function renderDebts(v){
  const present=["Все",...TYPES.filter(t=>S.agents.some(a=>typeOf(a)===t))];
  if(!present.includes(S.filter))S.filter="Все";
  const list=S.agents.filter(a=>S.filter==="Все"||typeOf(a)===S.filter).map(a=>({a,...stats(a.id),...overdue(a.id)})).sort((x,y)=>(y.on>0)-(x.on>0)||y.maxd-x.maxd||(y.wn>0)-(x.wn>0)||y.d-x.d);
  const tc=list.reduce((s,x)=>s+x.c,0),tp=list.reduce((s,x)=>s+Math.min(x.p,x.c),0);
  const ovS=list.reduce((s,x)=>s+x.os,0),ovN=list.reduce((s,x)=>s+x.on,0);
  const tot=list.reduce((s,x)=>s+Math.max(0,x.d),0);
  v.innerHTML=`<div class="col">
    <div class="total"><small>${S.filter==="Все"?"Ожидаю поступлений":"Ожидаю · "+S.filter.toLowerCase()}</small><b>${fmt(tot)}</b>
      <div class="tbar"><i style="width:${tc?Math.min(100,Math.round(tp/tc*100)):0}%"></i></div>
      <div class="tsub"><span>Оплачено ${fmt(tp)}</span><span>из ${fmt(tc)}</span></div>
      ${ovN?`<div class="tover">⚠ Просрочено: ${ovN} ${ovN%10===1&&ovN%100!==11?"услуга":ovN%10>=2&&ovN%10<=4&&(ovN%100<12||ovN%100>14)?"услуги":"услуг"} на ${fmt(ovS)}</div>`:""}</div>
    <input id="q-in" type="search" placeholder="Поиск: объект, услуга, партнёр" value="${esc(S.q||"")}" autocomplete="off">
    <div id="q-res" class="col"></div>
    ${present.length>2?`<div class="chips">${present.map(t=>`<button class="chip ${t===S.filter?"on":""}" data-f="${t}">${t}</button>`).join("")}</div>`:""}
    <div id="plist" class="col">${list.length?list.map(x=>`<button class="agent" data-a="${x.a.id}">${avatar(x.a)}<div style="flex:1"><div class="n">${esc(x.a.name)}</div><div class="s">${typeOf(x.a).toLowerCase()} · ${uslug(S.items.filter(i=>i.agentId===x.a.id).length)}</div></div><span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="pill ${x.d>0?"d":"z"}">${x.d>0?fmt(x.d):x.d<0?"аванс "+fmt(-x.d):"всё оплачено"}</span>${x.on?`<span class="pill d" style="font-size:12px">просрочка ${x.maxd} дн.</span>`:x.wn?`<span class="pill w" style="font-size:12px">срок через ${x.wmin} дн.</span>`:""}</span></button>`).join(""):`<p class="msg">Пока никого нет. Добавьте партнёра во вкладке «Партнёры».</p>`}</div></div>`;
  const qi=$("#q-in"),qr=$("#q-res"),pl=$("#plist"),ch=v.querySelector(".chips");
  const runQ=()=>{S.q=qi.value;const q=S.q.trim().toLowerCase();pl.hidden=!!q;if(ch)ch.hidden=!!q;
    if(!q){qr.innerHTML="";return}
    const al=allocAll().filter(i=>(i.what||"").toLowerCase().includes(q)||nm(i.agentId).toLowerCase().includes(q)).sort(byDate).reverse();
    const pp=S.payments.filter(p=>(p.note||"").toLowerCase().includes(q)||nm(p.agentId).toLowerCase().includes(q)).sort(byDate).reverse();
    qr.innerHTML=`<div class="card"><h2>Найдено: ${al.length} усл. на ${fmt(al.reduce((s,i)=>s+i.amount,0))}</h2>${al.map(i=>{const full=i.paid>=i.amount,part=i.paid>0&&!full;return `<div class="row" style="cursor:pointer" data-goa="${i.agentId}"><div><div>${esc(i.what)}</div><div class="t">${esc(nm(i.agentId))} · ${fdate(i.date)} · <span class="st ${full?"ok":part?"part":"no"}">${stTxt(i)}</span>${isArch(i)?" · в архиве":""}</div></div><span class="amt">${fmt(i.amount)}</span></div>`}).join("")||'<p class="t">Услуг не найдено</p>'}</div>
      ${pp.length?`<div class="card"><h2>Оплаты</h2>${pp.map(p=>`<div class="row" style="cursor:pointer" data-goa="${p.agentId}"><div><div>${esc(p.note||"Оплата")}</div><div class="t">${esc(nm(p.agentId))} · ${fdate(p.date)}</div></div><span class="amt p">${fmt(p.amount)}</span></div>`).join("")}</div>`:""}`;
    qr.querySelectorAll("[data-goa]").forEach(b=>b.onclick=()=>{S.open=b.dataset.goa;render();scrollTo(0,0)})};
  qi.addEventListener("input",runQ);if(S.q)runQ();
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});
  v.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.open=b.dataset.a;render();scrollTo(0,0)});
}

function renderAgent(v){
  const a=S.agents.find(x=>x.id===S.open);if(!a){S.open=null;return render()}
  const st=stats(a.id),allIt=alloc(a.id),archIt=allIt.filter(isArch),items=allIt.filter(i=>!isArch(i)).reverse().map(i=>({...i,...dueInfo(i)})).sort((x,y)=>({over:0,soon:1,wait:2,ok:3}[x.k])-({over:0,soon:1,wait:2,ok:3}[y.k])||(x.k==="over"?y.n-x.n:0));
  const pays=S.payments.filter(p=>p.agentId===a.id).sort(byDate).reverse();
  v.innerHTML=`<div class="col">
    <div style="display:flex;justify-content:space-between;gap:8px"><button class="sec" id="back">← Все партнёры</button><button class="sec" data-ed="agents/${a.id}">✎ Изменить</button></div>
    <div class="card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${avatar(a,48)}<div><div style="font-size:20px;font-weight:800">${esc(a.name)}</div><div class="t">${typeOf(a).toLowerCase()}</div></div></div>
      ${a.note?`<div class="t" style="margin:-4px 0 10px;white-space:pre-wrap">${esc(a.note)}</div>`:""}
      <div class="sum3"><div><small>Услуги</small><b>${fmt(st.c)}</b></div><div><small>Оплачено</small><b>${fmt(st.p)}</b></div><div><small>К оплате</small><b style="color:var(${st.d>0?"--red":"--ok"})">${fmt(st.d)}</b></div></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="sec" id="go-add" style="flex:1">+ Услуга</button><button class="sec" id="go-pay" style="flex:1">+ Оплата</button></div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="sec" id="go-rem" style="flex:1">💬 Напомнить</button><button class="sec" id="go-rep" style="flex:1">📄 Сверка</button></div></div>
    ${S.showArch?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 style="margin:0">Архив · ${archIt.length}</h2><button class="sec" id="arch-close">Скрыть</button></div>
      ${archIt.slice().reverse().map(i=>`<div class="row"><div style="min-width:0"><div>${esc(i.what)}</div><div class="t">${fdate(i.date)} · <span class="st ok">оплачено${i.paidOn?" "+fdate(i.paidOn):""}</span></div></div><div style="display:flex;align-items:center;gap:6px"><span class="amt">${fmt(i.amount)}</span><button class="sec" data-unarch="${i.id}" style="padding:6px 9px;font-size:13px">Вернуть</button></div></div>`).join("")||'<p class="msg">Архив пуст</p>'}</div>`:""}
    <div class="card"><h2>Услуги</h2><p class="t" style="margin:0 0 6px">Нажмите на кружок, чтобы отметить услугу оплаченной. Оплаченные уходят в архив через ${ARCH_DAYS} дней.</p>
      ${items.map(i=>{const full=i.paid>=i.amount,part=i.paid>0&&!full;
        return `<div class="row"><div style="display:flex;gap:10px;align-items:center;min-width:0"><button class="chk ${full?"full":part?"part":""}" data-tick="${i.id}" aria-label="Отметить оплаченной">${full?"✓":part?"½":""}</button>
        <div style="min-width:0;cursor:pointer" data-ed="items/${i.id}"><div>${esc(i.what)} <span class="t">✎</span></div><div class="t">${fdate(i.date)} · <span class="st ${full?"ok":part?"part":"no"}">${paidLabel(i)}</span>${i.k==="over"?` · <span class="st no">просрочено с ${fdate(dueOf(i))}</span>`:i.k==="soon"?` · <span class="st part">срок через ${i.n} дн.</span>`:i.due&&!full?` · до ${fdate(i.due)}`:""}</div></div></div>
        <div style="display:flex;align-items:center;gap:2px"><span class="amt">${fmt(i.amount)}</span>${full?`<button class="del" data-toarch="${i.id}" aria-label="В архив" title="В архив" style="font-size:15px">🗄</button>`:""}<button class="del" data-del="items/${i.id}" aria-label="Удалить">×</button></div></div>`}).join("")||'<p class="msg">Активных услуг нет</p>'}
      ${archIt.length&&!S.showArch?`<button class="sec" id="arch-open" style="width:100%;margin-top:10px;text-align:left;display:flex;justify-content:space-between"><span>Архив: ${uslug(archIt.length)} на ${fmt(archIt.reduce((x,i)=>x+i.amount,0))}</span><span>→</span></button>`:""}</div>

  $("#back").onclick=()=>{S.open=null;S.showArch=false;render()};bindEdit(v);
  const ao=$("#arch-open");if(ao)ao.onclick=()=>{S.showArch=true;render();scrollTo(0,0)};

  $("#go-add").onclick=()=>{S.tab="add";render()};$("#go-pay").onclick=()=>{S.tab="pay";render()};
  $("#go-rem").onclick=()=>{S.remind=a.id;render();scrollTo(0,0)};$("#go-rep").onclick=()=>{S.report=a.id;S.rper="all";render();scrollTo(0,0)};
  v.querySelectorAll("[data-tick]").forEach(b=>b.onclick=async()=>{
    const it=items.find(i=>i.id===b.dataset.tick);const rest=it.amount-it.paid;
    if(rest<=0){toast("Уже оплачено. Чтобы отменить, удалите оплату ниже.");return}
    b.disabled=true;
    try{await S.db.collection("payments").add({agentId:a.id,amount:rest,date:today(),note:"За: "+it.what,itemId:it.id,created:Date.now()});logIt(it.id,a.id,"отмечено оплаченным ("+fmt(rest)+")");toast("Отмечено: оплачено "+fmt(rest))}
    catch(e){toast("Не сохранилось");b.disabled=false}});
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Удалить?";b.style.fontSize="13px";b.style.color="var(--red)";setTimeout(()=>{if(b.isConnected){b.dataset.c="";b.textContent="×";b.style.fontSize="";b.style.color=""}},3000);return}
    const [dk,did]=b.dataset.del.split("/"),dx=S[dk].find(o=>o.id===did);
    try{await S.db.doc(b.dataset.del).delete();toast("Удалено");if(dx){if(dk==="payments")logIt(dx.itemId||"",dx.agentId,"удалена оплата "+fmt(dx.amount)+" от "+fdate(dx.date)+(dx.note?" ("+dx.note+")":""));else logIt(did,dx.agentId,"услуга удалена: "+dx.what+", "+fmt(dx.amount))}}catch(e){toast("Не удалось удалить")}});
}

function renderForm(v,pay){
  if(!S.agents.length){v.innerHTML=`<p class="msg">Сначала добавьте партнёра во вкладке «Партнёры».</p>`;return}
  v.innerHTML=`<div class="card"><h2>${pay?"Поступила оплата":"Новая услуга"}</h2>
    <label for="f-agent">Партнёр</label><select id="f-agent">${agentOpts(S.open)}</select>
    ${pay?"":`<label for="f-what">Услуга и объект</label><div class="chips" style="margin-bottom:6px">${TPL.map(t=>`<button class="chip" type="button" data-tpl="${t}">${t}</button>`).join("")}</div><input id="f-what" placeholder="ДКП Ботаничка 808">`}
    <label for="f-amt">Сумма, ₽</label><input id="f-amt" inputmode="numeric" placeholder="0" autocomplete="off">
    <label for="f-date">Дата</label><input id="f-date" type="date" value="${today()}">
    ${pay?"":`<label for="f-due">Оплатить до (необязательно)</label><input id="f-due" type="date"><p class="t" style="margin:4px 0 0">Если не указать, срок — месяц от даты услуги.</p>`}
    ${pay?`<label for="f-note">Комментарий (необязательно)</label><input id="f-note" placeholder="перевод на карту">
    <label style="display:flex;gap:10px;align-items:center;color:var(--fg);font-size:15px;margin-top:14px"><input type="checkbox" id="f-toinc" checked style="width:22px;height:22px;flex:none"> Записать в доходы «Финансов»</label>
    <p class="t" style="margin:10px 0 0">Оплата сама закроет самые старые неоплаченные услуги.</p>`:""}
    <button class="main" id="f-save">${pay?"Записать оплату":"Добавить услугу"}</button></div>`;
  bindMoney("f-amt");
  v.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{const w=$("#f-what");const rest=w.value.replace(new RegExp("^("+TPL.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\s*"),"");w.value=b.dataset.tpl+" "+rest;v.querySelectorAll("[data-tpl]").forEach(x=>x.classList.toggle("on",x===b));w.focus()});
  $("#f-save").onclick=async()=>{
    const agentId=$("#f-agent").value,amount=num($("#f-amt").value),date=$("#f-date").value||today();
    if(!amount){toast("Укажите сумму");return}
    const rec=pay?{agentId,amount,date,note:$("#f-note").value.trim(),created:Date.now()}:{agentId,amount,date,what:$("#f-what").value.trim(),created:Date.now()};
    if(!pay&&$("#f-due").value)rec.due=$("#f-due").value;
    if(!pay&&!rec.what){toast("Укажите услугу");return}
    $("#f-save").disabled=true;
    const toInc=pay&&$("#f-toinc")?.checked;
    try{const ref=await S.db.collection(pay?"payments":"items").add(rec);if(toInc){S.db.collection("ops").add({kind:"inc",amount,cat:"Дополнительный",desc:"Оплата: "+nm(agentId)+(rec.note?" — "+rec.note:""),date,note:"",fromPay:ref.id,created:Date.now()}).catch(()=>{})}logIt(pay?"":ref.id,agentId,pay?"внесена оплата "+fmt(amount)+" от "+fdate(date):"услуга добавлена, "+fmt(amount));toast(pay?"Оплата записана":"Услуга добавлена");S.open=agentId;S.tab="debts";render()}
    catch(e){toast("Не сохранилось");$("#f-save").disabled=false}
  };
}

function histHtml(x){
  const ai=alloc(x.agentId).find(i=>i.id===x.id)||x;
  const ev=[];
  if(x.created&&x.created>1e12)ev.push({t:x.created,txt:"услуга внесена, "+fmt(x.amount)});
  S.log.filter(l=>l.itemId===x.id&&!/^услуга добавлена/.test(l.text)).forEach(l=>ev.push({t:l.t,txt:l.text}));
  S.payments.filter(p=>p.itemId===x.id&&!S.log.some(l=>l.itemId===x.id&&Math.abs(l.t-(p.created||0))<5000)).forEach(p=>ev.push({t:p.created||Date.parse(p.date),txt:"оплата "+fmt(p.amount)+" от "+fdate(p.date)}));
  ev.sort((a,b)=>a.t-b.t);
  const archD=ai.arch===true?null:(ai.paid>=ai.amount&&ai.paidOn&&ai.arch!==false?addDays(ai.paidOn,ARCH_DAYS):null);
  return `<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><h2>История</h2>

  const d=new DOMParser().parseFromString(html,"text/html");let body="";
  const F='<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>';
  for(const el of d.body.children){const tg=el.tagName;
    if(tg==="H1")body+=wP(wRuns(el,F+'<w:b/><w:sz w:val="36"/>'),'<w:spacing w:after="60"/>');
    else if(tg==="H2")body+=wP(wRuns(el,F+'<w:b/><w:caps/><w:color w:val="4D4A45"/><w:sz w:val="22"/>'),'<w:spacing w:before="320" w:after="120"/>');
    else if(tg==="P")body+=wP(wRuns(el,F+(el.className==="sub"||el.className==="foot"?'<w:color w:val="85817B"/><w:sz w:val="20"/>':'<w:sz w:val="22"/>')),el.className==="foot"?'<w:spacing w:before="480"/>':'<w:spacing w:after="160"/>');
    else if(tg==="TABLE"){const tot=el.classList.contains("tot");
      const rows=[...el.querySelectorAll("tr")];
      body+=`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${tot?"":'<w:tblBorders><w:top w:val="single" w:sz="4" w:color="D9D5CE"/><w:left w:val="single" w:sz="4" w:color="D9D5CE"/><w:bottom w:val="single" w:sz="4" w:color="D9D5CE"/><w:right w:val="single" w:sz="4" w:color="D9D5CE"/><w:insideH w:val="single" w:sz="4" w:color="D9D5CE"/><w:insideV w:val="single" w:sz="4" w:color="D9D5CE"/></w:tblBorders>'}<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
        rows.map(tr=>{const big=tr.classList.contains("big");return `<w:tr>`+[...tr.children].map(td=>{const th=td.tagName==="TH",num=td.classList.contains("n");
          const rp=F+(th||tot?"<w:b/>":"")+(big?'<w:sz w:val="26"/>':'<w:sz w:val="20"/>')+[...td.classList].filter(k=>COL[k]).map(k=>`<w:color w:val="${COL[k]}"/>`).join("");
          return `<w:tc><w:tcPr>${th?'<w:shd w:val="clear" w:color="auto" w:fill="EFEDEA"/>':""}</w:tcPr>${wP(wRuns(td,rp)||"",(num?'<w:jc w:val="right"/>':"")+'<w:spacing w:after="0"/>')}</w:tc>`}).join("")+`</w:tr>`}).join("")+`</w:tbl>`+wP("");}
  }
  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:"blob"});
}
async function saveDoc(name,html){
  if(!window.JSZip){toast("Не загрузилось, обновите страницу");return}
  const dl=await window.claude?.use?.("downloads");if(!dl){toast("Скачивание недоступно здесь");return}
  try{const blob=await htmlToDocx(html);await dl.save({filename:name.replace(/[\\/:*?"<>|]/g,"")+".docx",data:blob});toast("Готово")}
  catch(e){toast(e?.code==="declined"?"Скачивание отменено":"Не удалось скачать"+(e?.code?" ("+e.code+")":""))}
}

const $=s=>document.querySelector(s);
const sp=n=>(Math.round(n)||0).toLocaleString("ru-RU").replace(/[ ,]/g," ");
const fmt=n=>sp(n)+" ₽";
const num=v=>Number(String(v).replace(/[^\d]/g,""))||0;
const today=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
const ym=d=>(d||"").slice(0,7);
const fdate=d=>d?d.split("-").reverse().join("."):"";
const mname=m=>MONF[+m.slice(5)-1]+" "+m.slice(0,4);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cfg=()=>S.cfg||DEF;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2200)}
function bindMoney(id){const e=$("#"+id);if(!e)return;e.addEventListener("input",()=>{const n=num(e.value);e.value=n?sp(n):""})}
const addM=(m,k)=>{let y=+m.slice(0,4),mo=+m.slice(5)-1+k;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+"-"+String(mo+1).padStart(2,"0")};

/* Распределение как в таблице: остаток = доход − расход; расходный фонд = остаток × %; транзит = остаток − расходный; остальные фонды делят транзит пропорционально своим % */
function distribute(inc,exp){
  const rem=Math.max(inc-exp,0),F=cfg().funds,sf=F.find(f=>f.spend),sp_=sf?sf.pct/100:0;
  const spendAmt=Math.round(rem*sp_),transit=rem-spendAmt;
  const rows=F.map(f=>({...f,amt:f.spend?spendAmt:(1-sp_===0?0:Math.round(transit*(f.pct/100)/(1-sp_)))}));
  const sum=rows.reduce((a,r)=>a+r.amt,0);
  return{rem,transit,spendAmt,rows,left:rem-sum};
}
function monthTot(m){const o=S.ops.filter(x=>ym(x.date)===m);
  const inc=o.filter(x=>x.kind==="inc").reduce((a,x)=>a+x.amount,0),exp=o.filter(x=>x.kind==="exp").reduce((a,x)=>a+x.amount,0);return{o,inc,exp}}
function months(){const ms=new Set(S.ops.map(x=>ym(x.date)).filter(Boolean));ms.add(ym(today()));return[...ms].sort()}

function render(){
  document.querySelectorAll("#nav-f button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  const v=$("#view-f");v.removeAttribute("style");if(window.APP!=="f"){v.innerHTML="";return}
  if(!S.db){v.innerHTML=`<p class="msg">${S.fail?"Не удалось подключиться к хранилищу. Откройте страницу, войдя в свой аккаунт Claude.":"Загружаю данные…"}</p>`;return}
  if(S.edit)return renderEdit(v);
  if(S.txt)return renderText(v);
  if(S.tab==="month")return renderMonth(v);
  if(S.tab==="inc"||S.tab==="exp")return renderForm(v,S.tab);
  if(S.tab==="funds")return renderFunds(v);
  if(S.tab==="stats")return renderStats(v);
}

function opRow(x){const inc=x.kind==="inc";
  return `<div class="row" style="cursor:pointer" data-ed="${x.id}"><div><div>${esc(x.desc||(inc?x.cat:x.cat))} <span class="t">✎</span></div><div class="t">${fdate(x.date)} · ${esc(x.cat)}${x.note?" · "+esc(x.note):""}</div></div><span class="amt ${inc?"p":""}">${inc?"+":"−"}${fmt(x.amount)}</span></div>`}

function renderMonth(v){
  if(!S.month)S.month=ym(today());
  const m=S.month,{o,inc,exp}=monthTot(m),d=distribute(inc,exp);
  const incs=o.filter(x=>x.kind==="inc").sort((a,b)=>b.date.localeCompare(a.date)),exps=o.filter(x=>x.kind==="exp").sort((a,b)=>b.date.localeCompare(a.date));
  const byCat={};exps.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...cats.map(c=>c[1]));
  const byInc={};incs.forEach(x=>byInc[x.cat]=(byInc[x.cat]||0)+x.amount);
  const LIM=cfg().limits||{},cur=m===ym(today());
  const limCats=Object.keys(LIM).filter(c=>LIM[c]>0).map(c=>[c,byCat[c]||0,LIM[c]]);
  const dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),day=+today().slice(8);
  const fExp=cur&&day>=7&&day<dim?Math.round(exp/day*dim):null;
  const rec=(cfg().recur||[]).map(r=>({...r,paid:o.some(x=>x.recId===r.id)}));
  v.innerHTML=`<div class="col">
    <input id="q-in" type="search" placeholder="Поиск по всем операциям" value="${esc(S.q||"")}" autocomplete="off">
    <div id="q-res" class="col"></div><div id="m-body" class="col">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><button class="sec" id="m-prev" aria-label="Предыдущий месяц">‹</button><b style="font-size:18px">${mname(m)}</b><button class="sec" id="m-next" aria-label="Следующий месяц">›</button></div>
    <div class="total"><small>Остаток к распределению</small><b>${fmt(d.rem)}</b>
      <div class="tbar"><i style="width:${inc?Math.min(100,Math.round(exp/inc*100)):0}%;background:var(--onacc);opacity:.55"></i></div>
      <div class="tsub"><span>Доход ${fmt(inc)}</span><span>Расход ${fmt(exp)}</span></div>
      ${exp>inc?`<div class="tover">Расходы больше доходов на ${fmt(exp-inc)}</div>`:""}
      ${fExp!==null&&exp>0?`<div class="tover" style="font-weight:600">Прогноз на конец месяца: расход ~${fmt(fExp)}, остаток ~${fmt(Math.max(0,inc-fExp))}</div>`:""}</div>
    ${rec.length?`<div class="card"><h2>Регулярные платежи · ${rec.filter(r=>r.paid).length} из ${rec.length}</h2>${rec.sort((a,b)=>a.paid-b.paid||a.day-b.day).map(r=>`<div class="row"><div><div>${esc(r.name)}</div><div class="t">${esc(r.cat)} · до ${r.day} числа${!r.paid&&cur&&day>=r.day?' · <span class="st no">пора оплатить</span>':""}</div></div><span style="display:flex;align-items:center;gap:6px"><span class="amt">${fmt(r.amount)}</span>${r.paid?'<span class="st ok">✓ внесено</span>':`<button class="sec" data-rec="${r.id}" style="padding:6px 10px;font-size:13px">Внести</button>`}</span></div>`).join("")}</div>`:""}
    ${limCats.length?`<div class="card"><h2>Лимиты</h2>${limCats.map(([c,a,l])=>{const p=a/l;return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(c)}</span><span class="amt" style="color:var(${p>1?"--red":p>=.8?"--amb":"--fg"})">${sp(a)} из ${fmt(l)}</span></div><div class="meter"><i style="width:${Math.min(100,Math.round(p*100))}%;background:var(${p>1?"--red":p>=.8?"--amb":"--ok"})"></i></div><div class="t" style="margin-top:3px">${p>1?"превышен на "+fmt(a-l):"осталось "+fmt(l-a)}</div></div>`}).join("")}</div>`:""}
    <div class="card"><h2>Распределение по фондам</h2>
      ${fundRows(d.rows,d.transit)}
      ${d.left?`<p class="t" style="margin:8px 0 0">Остаток от округления: ${fmt(d.left)}</p>`:""}</div>
    <div class="card"><h2>Доходы · ${fmt(inc)}</h2>
      ${Object.keys(byInc).length>1?`<div class="t" style="margin-bottom:6px">${Object.entries(byInc).map(([k,a])=>esc(k)+": "+fmt(a)).join(" · ")}</div>`:""}
      ${incs.map(opRow).join("")||'<p class="msg">Доходов пока нет. Добавьте во вкладке «Доход».</p>'}</div>
    <div class="card"><h2>Расходы · ${fmt(exp)}</h2>
      ${cats.map(([c,a])=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><span class="amt">${fmt(a)}</span></div><div class="meter"><i style="width:${Math.round(a/mx*100)}%"></i></div></div>`).join("")}
      ${exps.length?`<details style="margin-top:8px"><summary class="t" style="cursor:pointer">Все расходы (${exps.length})</summary>${exps.map(opRow).join("")}</details>`:'<p class="msg">Расходов пока нет. Добавьте во вкладке «Расход».</p>'}</div>
    <button class="sec" id="m-txt" style="width:100%">💬 Отчёт за месяц текстом</button>
  </div></div>`;
  v.querySelectorAll("[data-rec]").forEach(b=>b.onclick=async()=>{const r=rec.find(x=>x.id===b.dataset.rec);b.disabled=true;
    const dt=cur?today():m+"-"+String(Math.min(r.day,dim)).padStart(2,"0");
    try{await S.db.collection("ops").add({kind:"exp",amount:r.amount,cat:r.cat,desc:r.name,date:dt,note:"",recId:r.id,created:Date.now()});toast("Внесено: "+r.name)}catch(e){toast("Не сохранилось");b.disabled=false}});
  $("#m-txt").onclick=()=>{S.txt=monthText(m);render();scrollTo(0,0)};
  const qi=$("#q-in"),qr=$("#q-res"),mb=$("#m-body");
  const runQ=()=>{S.q=qi.value;const q=S.q.trim().toLowerCase();mb.hidden=!!q;if(!q){qr.innerHTML="";return}
    const f=S.ops.filter(x=>[x.desc,x.cat,x.note,sp(x.amount),fdate(x.date)].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
    const si=f.filter(x=>x.kind==="inc").reduce((a,x)=>a+x.amount,0),se=f.filter(x=>x.kind==="exp").reduce((a,x)=>a+x.amount,0);
    qr.innerHTML=`<div class="card"><h2>Найдено: ${f.length}</h2><div class="t" style="margin-bottom:6px">доходы ${fmt(si)} · расходы ${fmt(se)}</div>${f.map(opRow).join("")||'<p class="t">Ничего не найдено</p>'}</div>`;
    qr.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{S.edit=b.dataset.ed;render();scrollTo(0,0)})};
  qi.addEventListener("input",runQ);if(S.q)runQ();
  $("#m-prev").onclick=()=>{S.month=addM(S.month,-1);render()};$("#m-next").onclick=()=>{S.month=addM(S.month,1);render()};
  v.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{S.edit=b.dataset.ed;render();scrollTo(0,0)});
}
function monthText(m){const{o,inc,exp}=monthTot(m),d=distribute(inc,exp);const bc={};o.filter(x=>x.kind==="exp").forEach(x=>bc[x.cat]=(bc[x.cat]||0)+x.amount);
  return `Финансы за ${mname(m).toLowerCase()}:\nДоход: ${fmt(inc)}\nРасход: ${fmt(exp)}\nОстаток: ${fmt(d.rem)}\n\nРасходы по категориям:\n`+(Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`— ${c} — ${fmt(a)}`).join("\n")||"— нет")+
  `\n\nРаспределение:\n`+d.rows.filter(r=>r.spend).map(r=>`— ${r.name} — ${fmt(r.amt)}`).join("\n")+`\n— Транзитный счёт — ${fmt(d.transit)}\n`+d.rows.filter(r=>!r.spend).map(r=>`— ${r.name} — ${fmt(r.amt)}`).join("\n")}
function renderText(v){
  v.innerHTML=`<div class="col"><div><button class="sec" id="t-back">← Назад</button></div><div class="card"><h2>Отчёт текстом</h2><p class="t" style="margin:0 0 8px">Можно поправить текст перед копированием.</p>
    <textarea id="t-text" rows="16" style="width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical">${esc(S.txt)}</textarea>
    <button class="main" id="t-copy">Скопировать текст</button></div></div>`;
  $("#t-back").onclick=()=>{S.txt=null;render()};
  $("#t-copy").onclick=()=>{const t=$("#t-text");const sel=()=>{t.focus();t.select();toast("Выделено — нажмите «Скопировать»")};if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast("Скопировано")).catch(sel);else sel()};
}
const sp1=n=>String(Math.round(n*10)/10).replace(".",",");

function renderForm(v,kind){
  const inc=kind==="inc",list=inc?cfg().incs:cfg().cats;
  v.innerHTML=`<div class="card"><h2>${inc?"Новый доход":"Новый расход"}</h2>
    <label for="f-amt">Сумма, ₽</label><input id="f-amt" inputmode="numeric" placeholder="0" autocomplete="off">
    <label>${inc?"Вид дохода":"Категория"}</label><div class="chips" id="f-cats">${list.map((c,k)=>`<button type="button" class="chip ${k===0&&inc?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <label for="f-desc">Описание</label><input id="f-desc" placeholder="${inc?"Аванс, одобрение ипотеки…":"Продукты, такси до офиса…"}">
    <label for="f-date">Дата</label><input id="f-date" type="date" value="${today()}">
    <label for="f-note">Комментарий (необязательно)</label><input id="f-note">
    <button class="main" id="f-save">${inc?"Записать доход":"Записать расход"}</button></div>`;
  bindMoney("f-amt");
  if(!inc){const seen=new Set(),qk=[];S.ops.filter(x=>x.kind==="exp"&&!x.recId).sort((a,b)=>(b.created||0)-(a.created||0)).forEach(x=>{const k=x.cat+"|"+(x.desc||"")+"|"+x.amount;if(!seen.has(k)&&qk.length<6){seen.add(k);qk.push(x)}});
    if(qk.length){const box=document.createElement("div");box.className="card";box.innerHTML=`<h2>Быстрый ввод</h2><p class="t" style="margin:0 0 8px">Одно нажатие — расход записан сегодняшней датой.</p><div class="chips">${qk.map((x,k)=>`<button class="chip" data-qk="${k}">${esc(x.desc||x.cat)} · ${sp(x.amount)}</button>`).join("")}</div>`;
      v.prepend(box);v.style.display="flex";v.style.flexDirection="column";v.style.gap="10px";
      box.querySelectorAll("[data-qk]").forEach(b=>b.onclick=async()=>{const x=qk[+b.dataset.qk];b.disabled=true;try{await S.db.collection("ops").add({kind:"exp",amount:x.amount,cat:x.cat,desc:x.desc||"",date:today(),note:"",created:Date.now()});toast("Записано: "+(x.desc||x.cat)+" "+fmt(x.amount));b.disabled=false}catch(e){toast("Не сохранилось");b.disabled=false}})}}
  let cat=inc?list[0]:"";
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;v.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x===b))});
  $("#f-save").onclick=async()=>{const amount=num($("#f-amt").value);if(!amount){toast("Укажите сумму");return}if(!cat){toast("Выберите категорию");return}
    const rec={kind,amount,cat,desc:$("#f-desc").value.trim(),date:$("#f-date").value||today(),note:$("#f-note").value.trim(),created:Date.now()};
    $("#f-save").disabled=true;
    try{await S.db.collection("ops").add(rec);toast(inc?"Доход записан":"Расход записан");S.month=ym(rec.date);S.tab="month";render();scrollTo(0,0)}
    catch(e){toast("Не сохранилось");$("#f-save").disabled=false}};
}

function renderEdit(v){
  const x=S.ops.find(o=>o.id===S.edit);if(!x){S.edit=null;return render()}
  const inc=x.kind==="inc",list=inc?cfg().incs:cfg().cats;const opts=list.includes(x.cat)?list:[x.cat,...list];
  v.innerHTML=`<div class="card"><h2>${inc?"Изменить доход":"Изменить расход"}</h2>
    <label for="e-amt">Сумма, ₽</label><input id="e-amt" inputmode="numeric" value="${sp(x.amount)}">
    <label for="e-cat">${inc?"Вид дохода":"Категория"}</label><select id="e-cat">${opts.map(c=>`<option ${c===x.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <label for="e-desc">Описание</label><input id="e-desc" value="${esc(x.desc||"")}">
    <label for="e-date">Дата</label><input id="e-date" type="date" value="${x.date}">
    <label for="e-note">Комментарий</label><input id="e-note" value="${esc(x.note||"")}">
    <button class="main" id="e-save">Сохранить</button>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="sec" id="e-cancel" style="flex:1">Отмена</button><button class="sec" id="e-del" style="flex:1;color:var(--red)">Удалить</button></div></div>`;
  bindMoney("e-amt");
  const close=()=>{S.edit=null;render()};$("#e-cancel").onclick=close;
  $("#e-save").onclick=async()=>{const amount=num($("#e-amt").value);if(!amount){toast("Укажите сумму");return}
    const d={amount,cat:$("#e-cat").value,desc:$("#e-desc").value.trim(),date:$("#e-date").value||x.date,note:$("#e-note").value.trim()};
    try{await S.db.doc("ops/"+x.id).update(d);toast("Сохранено");S.month=ym(d.date);close()}catch(e){toast("Не сохранилось")}};
  const del=$("#e-del");del.onclick=async()=>{if(del.dataset.c!=="1"){del.dataset.c="1";del.textContent="Точно удалить?";return}
    try{await S.db.doc("ops/"+x.id).delete();toast("Удалено");close()}catch(e){toast("Не удалось удалить")}};
}

function renderFunds(v){
  const SUB=[["funds","Фонды"],["goals","Цели"],["limits","Лимиты"],["recur","Регулярные"]];S.sub=S.sub||"funds";
  const head=`<div class="chips" style="margin-bottom:2px">${SUB.map(([k,l])=>`<button class="chip ${S.sub===k?"on":""}" data-sub="${k}">${l}</button>`).join("")}</div>`;
  const bindSub=()=>v.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.sub;render()});
  if(S.sub==="goals"){renderGoals(v,head);return bindSub()}
  if(S.sub==="limits"){renderLimits(v,head);return bindSub()}
  if(S.sub==="recur"){renderRecur(v,head);return bindSub()}
  renderFundsMain(v,head);bindSub();
}
function renderGoals(v,head){
  const G=cfg().goals||[];
  v.innerHTML=`<div class="col">${head}
    ${G.map(g=>{const p=g.target?Math.min(1,(g.saved||0)/g.target):0;const ml=g.deadline?Math.max(1,(+g.deadline.slice(0,4)-+today().slice(0,4))*12+(+g.deadline.slice(5,7)-+today().slice(5,7))):0;const need=Math.max(0,g.target-(g.saved||0));
      return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-size:17px">${esc(g.name)}</b><span class="t">${g.deadline?"к "+fdate(g.deadline):""}</span></div>
      <div style="font-size:24px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums">${fmt(g.saved||0)} <span class="t" style="font-size:14px;font-weight:600">из ${fmt(g.target)}</span></div>
      <div class="meter" style="height:10px"><i style="width:${Math.round(p*100)}%;background:var(--ok)"></i></div>
      <div class="t" style="margin-top:6px">${p>=1?"Цель достигнута 🎉":g.deadline?`Откладывайте ~${fmt(need/ml)} в месяц, чтобы успеть (осталось ${fmt(need)})`:`Осталось ${fmt(need)}`}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="g-${g.id}" inputmode="numeric" placeholder="Сумма" style="flex:1"><button class="sec" data-gadd="${g.id}">+ Пополнить</button><button class="sec" data-gsub="${g.id}">− Снять</button></div>
      <button class="del" data-gdel="${g.id}" style="margin-top:8px;font-size:13px">Удалить цель</button></div>`}).join("")||'<div class="card"><p class="msg" style="padding:6px">Целей пока нет. Это необязательно — добавьте, если копите на что-то конкретное.</p></div>'}
    <div class="card"><h2>Новая цель</h2>
      <label for="ng-name">Название</label><input id="ng-name" placeholder="Отпуск в Сочи">
      <label for="ng-t">Сумма цели, ₽</label><input id="ng-t" inputmode="numeric" placeholder="150 000">
      <label for="ng-d">Срок (необязательно)</label><input id="ng-d" type="date">
      <label for="ng-s">Уже накоплено, ₽</label><input id="ng-s" inputmode="numeric" placeholder="0">
      <button class="main" id="ng-add">Добавить цель</button></div></div>`;
  ["ng-t","ng-s",...G.map(g=>"g-"+g.id)].forEach(bindMoney);
  const save=(goals,msg)=>saveCfg({...cfg(),goals},msg);

function wordReport(per,P){
  const isM=per.length===7,title="Финансовый отчёт",sub=(isM?mname(per):"Весь "+per+" год")+" · сформировано "+fdate(today());
  let b=`<table class="tot"><tr><td>Доход</td><td class="n ok">${fmt(P.inc)}</td></tr><tr><td>Расход</td><td class="n">${fmt(P.exp)}</td></tr><tr class="big"><td>Остаток</td><td class="n">${fmt(P.inc-P.exp)}</td></tr></table>`;
  if(P.incs.length)b+="<h2>Доходы по видам</h2>"+tbl(["Вид дохода","Сумма, ₽"],P.incs.map(([k,a])=>[k,sp(a)]),[1]);
  b+="<h2>Распределение по фондам</h2>"+tbl(["Фонд","%","Сумма, ₽"],[...P.funds.filter(f=>f.spend).map(f=>[{h:"<b>"+esc(f.name)+"</b>"},sp1(f.pct),sp(f.amt)]),[{h:"<b>Транзитный счёт</b>"},"",sp(P.transit)],...P.funds.filter(f=>!f.spend).map(f=>[f.name,sp1(f.pct),sp(f.amt)])],[1,2]);
  b+="<h2>Расходы по категориям</h2>"+(P.cats.length?tbl(["Категория","Сумма, ₽","Доля"],P.cats.map(([c,a])=>[c,sp(a),Math.round(a/P.exp*100)+"%"]),[1,2]):"<p>Расходов нет</p>");
  if(!isM)b+="<h2>По месяцам</h2>"+tbl(["Месяц","Доход, ₽","Расход, ₽","Остаток, ₽"],P.rows.map(r=>[mname(r.m),sp(r.inc),sp(r.exp),sp(r.inc-r.exp)]),[1,2,3]);
  b+="<h2>Операции</h2>"+(P.o.length?tbl(["Дата","Тип","Категория","Описание","Сумма, ₽"],P.o.slice().sort((a,c)=>a.date.localeCompare(c.date)).map(x=>[fdate(x.date),x.kind==="inc"?"Доход":"Расход",x.cat,x.desc||"",{h:`<span class="${x.kind==="inc"?"ok":""}">${x.kind==="inc"?"+":"−"}${sp(x.amount)}</span>`}]),[4]):"<p>Операций нет</p>");
  saveDoc("Финансы "+(isM?mname(per):per),docHtml(title,sub,b));
}
function docHtml(title,sub,body){return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(title)}</title>
<style>@page{size:21cm 29.7cm;margin:2cm}body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#262523}h1{font-size:18pt;margin:0 0 4pt}h2{font-size:12pt;margin:16pt 0 6pt;color:#4d4a45;text-transform:uppercase;letter-spacing:1pt}.sub{color:#85817b;margin:0 0 12pt}table{border-collapse:collapse;width:100%}th{background:#efedea;text-align:left;font-weight:bold}th,td{border:1px solid #d9d5ce;padding:4pt 6pt;vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}.tot td{font-weight:bold;border:none;padding:3pt 6pt}.big td{font-size:13pt}.ok{color:#3f7a4c}.no{color:#9b3a2e}.part{color:#7a5a12}.foot{margin-top:24pt;color:#85817b;font-size:9pt}</style></head><body>
<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>${body}</body></html>`}
function tbl(head,rows,numCols=[]){return `<table><tr>${head.map((h,k)=>`<th${numCols.includes(k)?' class="n"':""}>${esc(h)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((c,k)=>`<td${numCols.includes(k)?' class="n"':""}>${typeof c==="object"&&c?c.h:esc(c)}</td>`).join("")}</tr>`).join("")}</table>`}
const XE=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL={ok:"3F7A4C",no:"9B3A2E",part:"7A5A12"};
function wRuns(node,base){let out="";node.childNodes.forEach(n=>{if(n.nodeType===3){if(n.textContent)out+=`<w:r><w:rPr>${base}</w:rPr><w:t xml:space="preserve">${XE(n.textContent)}</w:t></w:r>`}else{const c=[...(n.classList||[])].find(k=>COL[k]);out+=wRuns(n,base+(c?`<w:color w:val="${COL[c]}"/>`:"")+(n.tagName==="B"?"<w:b/>":""))}});return out}
const wP=(runs,pPr="")=>`<w:p><w:pPr>${pPr}</w:pPr>${runs}</w:p>`;
function htmlToDocx(html){
  const d=new DOMParser().parseFromString(html,"text/html");let body="";
  const F='<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>';
  for(const el of d.body.children){const tg=el.tagName;
    if(tg==="H1")body+=wP(wRuns(el,F+'<w:b/><w:sz w:val="36"/>'),'<w:spacing w:after="60"/>');
    else if(tg==="H2")body+=wP(wRuns(el,F+'<w:b/><w:caps/><w:color w:val="4D4A45"/><w:sz w:val="22"/>'),'<w:spacing w:before="320" w:after="120"/>');
    else if(tg==="P")body+=wP(wRuns(el,F+(el.className==="sub"||el.className==="foot"?'<w:color w:val="85817B"/><w:sz w:val="20"/>':'<w:sz w:val="22"/>')),el.className==="foot"?'<w:spacing w:before="480"/>':'<w:spacing w:after="160"/>');
    else if(tg==="TABLE"){const tot=el.classList.contains("tot");
      const rows=[...el.querySelectorAll("tr")];
      body+=`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${tot?"":'<w:tblBorders><w:top w:val="single" w:sz="4" w:color="D9D5CE"/><w:left w:val="single" w:sz="4" w:color="D9D5CE"/><w:bottom w:val="single" w:sz="4" w:color="D9D5CE"/><w:right w:val="single" w:sz="4" w:color="D9D5CE"/><w:insideH w:val="single" w:sz="4" w:color="D9D5CE"/><w:insideV w:val="single" w:sz="4" w:color="D9D5CE"/></w:tblBorders>'}<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
        rows.map(tr=>{const big=tr.classList.contains("big");return `<w:tr>`+[...tr.children].map(td=>{const th=td.tagName==="TH",num=td.classList.contains("n");
          const rp=F+(th||tot?"<w:b/>":"")+(big?'<w:sz w:val="26"/>':'<w:sz w:val="20"/>')+[...td.classList].filter(k=>COL[k]).map(k=>`<w:color w:val="${COL[k]}"/>`).join("");
          return `<w:tc><w:tcPr>${th?'<w:shd w:val="clear" w:color="auto" w:fill="EFEDEA"/>':""}</w:tcPr>${wP(wRuns(td,rp)||"",(num?'<w:jc w:val="right"/>':"")+'<w:spacing w:after="0"/>')}</w:tc>`}).join("")+`</w:tr>`}).join("")+`</w:tbl>`+wP("");}
  }
  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:"blob"});
}
async function saveDoc(name,html){
  if(!window.JSZip){toast("Не загрузилось, обновите страницу");return}
  const dl=await window.claude?.use?.("downloads");if(!dl){toast("Скачивание недоступно здесь");return}
  try{const blob=await htmlToDocx(html);await dl.save({filename:name.replace(/[\\/:*?"<>|]/g,"")+".docx",data:blob});toast("Готово")}
  catch(e){toast(e?.code==="declined"?"Скачивание отменено":"Не удалось скачать"+(e?.code?" ("+e.code+")":""))}
}
async function fillTemplate(){
  if(!window.JSZip){toast("Не загрузилось, обновите страницу");return}
  const dl=await window.claude?.use?.("downloads");if(!dl){toast("Скачивание недоступно здесь");return}
  try{
    const res=await fetch("template.txt");if(!res.ok)throw new Error("tpl");
    const zip=await JSZip.loadAsync((await res.text()).trim(),{base64:true});
    const P=new DOMParser(),X=new XMLSerializer(),NS="http://schemas.openxmlformats.org/spreadsheetml/2006/main";
    const wbx=P.parseFromString(await zip.file("xl/workbook.xml").async("string"),"application/xml");
    const rels=P.parseFromString(await zip.file("xl/_rels/workbook.xml.rels").async("string"),"application/xml");
    const relMap={};[...rels.getElementsByTagName("Relationship")].forEach(r=>relMap[r.getAttribute("Id")]=r.getAttribute("Target"));
    const sheets={};[...wbx.getElementsByTagName("sheet")].forEach(s=>{sheets[s.getAttribute("name").trim()]="xl/"+relMap[s.getAttribute("r:id")].replace(/^\/?xl\//,"")});
    const cp=wbx.getElementsByTagName("calcPr")[0];if(cp)cp.setAttribute("fullCalcOnLoad","1");
    zip.file("xl/workbook.xml",X.serializeToString(wbx));
    const COLS="ABCDEFG",serial=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/864e5+25569;
    let filled=0,skipped=0;const usedM=new Set(S.ops.map(x=>ym(x.date)));
    for(const [name,path] of Object.entries(sheets)){
      const mm=MONF.findIndex(n=>name.startsWith(n+" "));if(mm<0)continue;const m=name.slice(-4)+"-"+String(mm+1).padStart(2,"0");
      const doc=P.parseFromString(await zip.file(path).async("string"),"application/xml");
      const sd=doc.getElementsByTagName("sheetData")[0];const rows={};[...sd.getElementsByTagName("row")].forEach(r=>rows[+r.getAttribute("r")]=r);
      const getRow=n=>{if(rows[n])return rows[n];const r=doc.createElementNS(NS,"row");r.setAttribute("r",n);const nx=Object.keys(rows).map(Number).sort((a,b)=>a-b).find(k=>k>n);sd.insertBefore(r,nx?rows[nx]:null);rows[n]=r;return r};
      const colIdx=ref=>{let s=0;for(const ch of ref.replace(/\d+/g,""))s=s*26+ch.charCodeAt(0)-64;return s};
      const getCell=(row,ref)=>{const cs=[...row.getElementsByTagName("c")];let c=cs.find(x=>x.getAttribute("r")===ref);if(c)return c;c=doc.createElementNS(NS,"c");c.setAttribute("r",ref);const nx=cs.find(x=>colIdx(x.getAttribute("r"))>colIdx(ref));row.insertBefore(c,nx||null);return c};
      const clear=c=>{c.removeAttribute("t");while(c.firstChild)c.removeChild(c.firstChild)};
      for(let n=2;n<=200;n++){const r=rows[n];if(!r)continue;[...r.getElementsByTagName("c")].forEach(c=>{const ref=c.getAttribute("r");if(COLS.includes(ref.replace(/\d+/g,""))&&!c.getElementsByTagName("f").length)clear(c)})}
      const ops=S.ops.filter(x=>ym(x.date)===m).sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
      if(ops.length>199)skipped+=ops.length-199;
      ops.slice(0,199).forEach((x,k)=>{const n=k+2,row=getRow(n),inc=x.kind==="inc";
        const put=(col,val)=>{const c=getCell(row,col+n);clear(c);if(val===""||val==null)return;if(typeof val==="number"){const v=doc.createElementNS(NS,"v");v.textContent=String(val);c.appendChild(v)}else{c.setAttribute("t","inlineStr");const is=doc.createElementNS(NS,"is"),t=doc.createElementNS(NS,"t");t.setAttribute("xml:space","preserve");t.textContent=val;is.appendChild(t);c.appendChild(is)}};
        put("A",serial(x.date));put("B",inc?x.cat:"");put("C",inc?x.amount:"");put("D",inc?"":x.cat);put("E",inc?"":x.amount);put("F",x.desc||"");put("G",x.note||"");filled++});
      usedM.delete(m);
      zip.file(path,X.serializeToString(doc));
    }
    for(const path of Object.keys(zip.files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))){let t=await zip.file(path).async("string");t=t.replace(/(<f>[^<]*<\/f>|<f [^>]*\/>|<f [^>]*>[^<]*<\/f>)<v>[^<]*<\/v>/g,"$1");zip.file(path,t)}
    if(zip.file("xl/calcChain.xml")){zip.remove("xl/calcChain.xml");let ct=await zip.file("[Content_Types].xml").async("string");zip.file("[Content_Types].xml",ct.replace(/<Override[^>]*calcChain[^>]*\/>/,""));let wr=await zip.file("xl/_rels/workbook.xml.rels").async("string");zip.file("xl/_rels/workbook.xml.rels",wr.replace(/<Relationship[^>]*calcChain[^>]*\/>/,""))}
    usedM.forEach(m=>skipped+=S.ops.filter(x=>ym(x.date)===m).length);
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    await dl.save({filename:"Финансы (итог) "+fdate(today())+".xlsx",data:blob});
    toast("Готово: "+filled+" операций"+(skipped?", вне периода файла: "+skipped:""));
  }catch(e){toast(e?.code==="declined"?"Скачивание отменено":"Не удалось собрать файл"+(e?.code?" ("+e.code+")":""))}
}
async function exportXlsx(rows,fundY,cats){
  if(!window.XLSX){toast("Excel не загрузился, обновите страницу");return}
  const dl=await window.claude?.use?.("downloads");if(!dl){toast("Скачивание недоступно здесь");return}
  const wb=XLSX.utils.book_new(),add=(n,a)=>{const ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=a[0].map((_,k)=>({wch:Math.min(40,Math.max(10,...a.map(r=>String(r[k]??"").length+2)))}));XLSX.utils.book_append_sheet(wb,ws,n)};
  add("Итоги",[["Месяц","Доход","Расход","Остаток",...cfg().funds.map(f=>f.name),"Транзит"],...rows.map(r=>[mname(r.m),r.inc,r.exp,r.inc-r.exp,...r.d.rows.map(x=>x.amt),r.d.transit]),[],["Итого за год","","","",...fundY.map(f=>f.amt)]]);
  add("Операции",[["Дата","Тип","Категория","Описание","Сумма","Комментарий"],...S.ops.filter(x=>x.date.startsWith(S.year)).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[fdate(x.date),x.kind==="inc"?"Доход":"Расход",x.cat,x.desc||"",x.amount,x.note||""])]);
  add("Категории",[["Категория","Расход за год"],...cats]);
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  try{await dl.save({filename:"Финансы "+S.year+".xlsx",data:new Blob([buf])});toast("Готово")}catch(e){toast(e?.code==="declined"?"Скачивание отменено":"Не удалось скачать"+(e?.code?" ("+e.code+")":""))}
}

(async()=>{
  const timer=setTimeout(()=>{if(!S.db){S.fail=1;render()}},10000);
  const db=await window.claude?.use?.("db");
  if(!db){clearTimeout(timer);S.fail=1;render();return}
  let got=0;const ready=()=>{if(++got===2){S.db=db}};
  db.collection("ops").onSnapshot(snap=>{clearTimeout(timer);S.ops=snap.docs.map(d=>({id:d.id,...d.data()}));if(!S.db)ready();render()},()=>{clearTimeout(timer);S.fail=1;render()});
  db.collection("settings").onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==="main");S.cfg=d?{...DEF,...d.data()}:null;if(!S.db)ready();render()},()=>{});
})();

})();
